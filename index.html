<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>4つ並べゲーム</title>
<meta name="theme-color" content="#2e4dbf">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
:root{
  --bg:#eef1f9;
  --surface:#ffffff;
  --text:#1b2340;
  --muted:#5f6886;
  --line:#d3d9ea;
  --board:#2e4dbf;
  --board-dark:#213a99;
  --hole:#eef1f9;
  --red:#e2392c;
  --red-dark:#a9261c;
  --red-light:#ff8577;
  --yellow:#f6c522;
  --yellow-dark:#b98c05;
  --yellow-light:#ffe57a;
  --ring:#ffffff;
  --focus:#ff8a00;
  --shadow:0 12px 30px rgba(27,35,64,.14);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1527;
    --surface:#1a2238;
    --text:#eaeef9;
    --muted:#9aa5c4;
    --line:#2c3652;
    --board:#2947b3;
    --board-dark:#1b3390;
    --hole:#0f1527;
    --red:#e8463a;
    --red-dark:#9f2318;
    --red-light:#ff9086;
    --yellow:#f7c923;
    --yellow-dark:#a67d03;
    --yellow-light:#ffe98a;
    --ring:#ffffff;
    --focus:#ffb04d;
    --shadow:0 12px 30px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1527;
  --surface:#1a2238;
  --text:#eaeef9;
  --muted:#9aa5c4;
  --line:#2c3652;
  --board:#2947b3;
  --board-dark:#1b3390;
  --hole:#0f1527;
  --red:#e8463a;
  --red-dark:#9f2318;
  --red-light:#ff9086;
  --yellow:#f7c923;
  --yellow-dark:#a67d03;
  --yellow-light:#ffe98a;
  --ring:#ffffff;
  --focus:#ffb04d;
  --shadow:0 12px 30px rgba(0,0,0,.5);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{
  margin:0;
  padding:0 16px;
  background:var(--bg);
  color:var(--text);
  font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","BIZ UDPGothic","Yu Gothic","Meiryo",system-ui,sans-serif;
  font-weight:500;
  -webkit-text-size-adjust:100%;
}
.app{
  max-width:520px;
  margin:0 auto;
  padding-block:12px 32px;
  display:flex;
  flex-direction:column;
  gap:12px;
}
/* header */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 14px}
h1{
  margin:0;
  font-family:"Dela Gothic One","Zen Maru Gothic","Hiragino Maru Gothic ProN","Meiryo",sans-serif;
  font-weight:400;
  font-size:clamp(22px,6.5vw,30px);
  line-height:1.1;
  letter-spacing:.02em;
  text-wrap:balance;
}
h1 .four{
  color:var(--red);
  font-size:1.4em;
  vertical-align:-.06em;
  text-shadow:.06em .06em 0 rgba(0,0,0,.22);
}
.tag{margin:4px 0 0;font-size:12px;font-weight:700;color:var(--muted)}
.segs{display:flex;flex-wrap:wrap;gap:6px}
.seg{display:inline-flex;background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.seg button{
  border:0;background:transparent;color:var(--muted);
  font:inherit;font-weight:700;font-size:13px;line-height:1;
  padding:8px 12px;border-radius:999px;cursor:pointer;
  touch-action:manipulation;-webkit-tap-highlight-color:transparent;
}
.seg button.is-on{background:var(--text);color:var(--bg)}
.seg button:focus-visible{outline:3px solid var(--focus);outline-offset:1px}
/* status */
.status{display:flex;flex-direction:column;gap:8px}
.msg{
  display:flex;align-items:center;justify-content:center;gap:8px;
  font-family:"Dela Gothic One","Zen Maru Gothic","Meiryo",sans-serif;
  font-weight:400;font-size:clamp(17px,5vw,22px);line-height:1.2;
  min-height:1.4em;
}
.msg.is-result{font-size:clamp(22px,7vw,30px)}
.players{display:flex;justify-content:space-between;gap:10px}
.player{
  flex:1;display:flex;align-items:center;gap:8px;
  padding:8px 12px;border-radius:14px;
  background:var(--surface);border:2px solid var(--line);
  transition:border-color .2s,transform .2s;
}
.player.yellow{flex-direction:row-reverse;text-align:right}
.player.is-turn.red{border-color:var(--red)}
.player.is-turn.yellow{border-color:var(--yellow)}
.player .name{font-weight:900;font-size:15px}
.player .left{font-size:11px;color:var(--muted);margin-left:auto;white-space:nowrap}
.player.yellow .left{margin-left:0;margin-right:auto}
.player .left b{font-size:15px;color:var(--text);font-variant-numeric:tabular-nums}
.chip{
  width:22px;height:22px;border-radius:50%;flex:none;display:inline-block;
  box-shadow:inset 0 0 0 3px rgba(0,0,0,.14),0 1px 2px rgba(0,0,0,.35);
}
.chip.red{background:radial-gradient(circle at 36% 32%,var(--red-light) 0,var(--red) 42%,var(--red-dark) 100%)}
.chip.yellow{background:radial-gradient(circle at 36% 32%,var(--yellow-light) 0,var(--yellow) 42%,var(--yellow-dark) 100%)}
.chip.none{display:none}
.player.is-turn .chip{transform:scale(1.15)}
/* board */
.table{display:flex;flex-direction:column;align-items:center}
.board{
  position:relative;
  width:94%;
  display:grid;
  grid-template-columns:repeat(7,1fr);
  padding:2.2%;
  background:var(--board);
  border-top:6px solid var(--board-dark);
  border-radius:10px 10px 0 0;
  overflow:hidden;
  box-shadow:var(--shadow);
}
.base{
  width:100%;height:16px;
  background:var(--board-dark);
  border-radius:0 0 10px 10px;
  box-shadow:0 6px 0 rgba(0,0,0,.18);
}
.col{
  display:grid;
  min-width:0;
  cursor:pointer;
  border-radius:8px;
  outline:none;
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}
.col:focus-visible{box-shadow:inset 0 0 0 3px var(--focus)}
.board.locked .col{cursor:default}
.cell{position:relative;aspect-ratio:1}
.cell::before{
  content:"";position:absolute;inset:8%;border-radius:50%;
  background:var(--hole);
  box-shadow:inset 0 3px 5px rgba(0,0,0,.38);
}
.piece{
  position:absolute;inset:10%;border-radius:50%;z-index:2;
  font-size:14px;
  box-shadow:inset 0 0 0 .2em rgba(0,0,0,.14),inset 0 -.15em .2em rgba(0,0,0,.18),0 .12em .2em rgba(0,0,0,.35);
  will-change:transform;
}
.piece.red{background:radial-gradient(circle at 36% 32%,var(--red-light) 0,var(--red) 42%,var(--red-dark) 100%)}
.piece.yellow{background:radial-gradient(circle at 36% 32%,var(--yellow-light) 0,var(--yellow) 42%,var(--yellow-dark) 100%)}
.piece.ghost{opacity:.42;z-index:1;box-shadow:none}
.cell.win .piece{outline:4px solid var(--ring);outline-offset:2px;z-index:3}
.board.won .cell:not(.win) .piece{filter:saturate(.45) brightness(.75)}
/* actions */
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{
  font:inherit;font-weight:900;font-size:15px;line-height:1;
  padding:13px 20px;border-radius:999px;min-width:9.5em;
  border:2px solid var(--text);background:var(--surface);color:var(--text);
  cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;
}
.btn.primary{background:var(--red);border-color:var(--red-dark);color:#fff}
.btn:disabled{opacity:.38;cursor:default}
.btn:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.btn.primary.pulse{animation:pulse 1s ease-in-out infinite alternate}
@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.06)}}
.hint{display:none;margin:-4px 0 0;text-align:center;font-size:11px;color:var(--muted)}
@media (hover:hover) and (pointer:fine){.hint{display:block}}
/* score */
.score{
  display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px 10px;
  font-size:14px;color:var(--muted);
}
.score b{font-size:18px;color:var(--text);font-variant-numeric:tabular-nums}
.score .pair{display:inline-flex;align-items:center;gap:6px}
.score .chip{width:18px;height:18px}
.link{
  border:0;background:none;color:var(--muted);font:inherit;font-size:12px;
  text-decoration:underline;cursor:pointer;padding:4px 6px;
  touch-action:manipulation;-webkit-tap-highlight-color:transparent;
}
.link:focus-visible{outline:3px solid var(--focus);border-radius:4px}
/* update toast (PWA) */
.toast{
  position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));
  margin:0 auto;max-width:488px;z-index:50;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:12px 14px;border-radius:14px;
  background:var(--text);color:var(--bg);font-size:14px;font-weight:700;
  box-shadow:var(--shadow);
}
.toast .btn{min-width:0;padding:9px 14px;font-size:14px;border-color:var(--bg);background:var(--bg);color:var(--text)}
/* rules */
.rules{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:10px 14px}
.rules summary{cursor:pointer;font-weight:900;font-size:15px;padding:4px 0}
.rules ol{margin:8px 0 12px;padding-left:1.4em;font-size:14px;line-height:1.7}
.rules li{margin:0 0 4px}
.examples{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.example{display:flex;flex-direction:column;align-items:center;gap:6px}
.example .label{font-size:12px;font-weight:700}
.mini{
  width:100%;max-width:120px;display:grid;grid-template-columns:repeat(5,1fr);
  padding:4%;background:var(--board);border-radius:6px;border-top:3px solid var(--board-dark);
}
.mini .piece{font-size:6px}
.mini .cell.win .piece{outline-width:2px;outline-offset:1px}
@media (prefers-reduced-motion:reduce){
  .piece{transition:none!important}
  .btn.primary.pulse{animation:none}
  .player,.player .chip{transition:none}
}
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <div>
      <h1><span class="four">4</span>つ並べゲーム</h1>
      <p class="tag">タテ・ヨコ・ナナメのいずれかを先に4つそろえたら勝ち！</p>
    </div>
    <div class="segs">
      <div class="seg" role="group" aria-label="対戦相手">
        <button type="button" id="modePvp" class="is-on" aria-pressed="true">2人で対戦</button>
        <button type="button" id="modeCpu" aria-pressed="false">CPUと対戦</button>
      </div>
      <div class="seg" id="levelSeg" role="group" aria-label="CPUの強さ" hidden>
        <button type="button" id="lvWeak" aria-pressed="false">よわい</button>
        <button type="button" id="lvStrong" class="is-on" aria-pressed="true">つよい</button>
      </div>
    </div>
  </header>

  <section class="status" aria-live="polite">
    <div class="msg" id="msg"><span class="chip red" id="msgChip"></span><span id="msgText">赤の番</span></div>
    <div class="players">
      <div class="player red" id="pRed"><span class="chip red"></span><span class="name" id="nameRed">赤</span><span class="left">のこり <b id="leftRed">21</b></span></div>
      <div class="player yellow" id="pYel"><span class="chip yellow"></span><span class="name" id="nameYel">黄</span><span class="left">のこり <b id="leftYel">21</b></span></div>
    </div>
  </section>

  <section class="table">
    <div class="board" id="board" aria-label="ゲーム盤"></div>
    <div class="base"></div>
  </section>

  <div class="actions">
    <button type="button" class="btn" id="undoBtn">1手もどす</button>
    <button type="button" class="btn primary" id="newBtn">新しいゲーム</button>
  </div>
  <p class="hint">キーボード：← → で列を選んで Enter、または 1〜7 のキーで入れる</p>

  <div class="score">
    <span class="pair"><span class="chip red"></span><b id="sRed">0</b>勝</span>
    <span>−</span>
    <span class="pair"><b id="sYel">0</b>勝<span class="chip yellow"></span></span>
    <span>／ 引き分け <b id="sDraw">0</b></span>
    <button type="button" class="link" id="resetScore">成績をリセット</button>
  </div>

  <details class="rules">
    <summary>あそびかた</summary>
    <ol>
      <li>赤と黄が交互に、列を選んでコマを上から入れます。コマはいちばん下まで落ちます。</li>
      <li>タテ・ヨコ・ナナメのどれかで、自分の色を先に4つ並べたら勝ち。</li>
      <li>42個ぜんぶ入れても4つ並ばなければ引き分け。</li>
    </ol>
    <div class="examples" id="examples"></div>
  </details>
</div>
<div class="toast" id="updToast" hidden role="status"><span>新しいバージョンがあります</span><button type="button" class="btn" id="updBtn">更新する</button></div>

<script>
(function(){
'use strict';
var COLS=7, ROWS=6, TOTAL=ROWS*COLS, BIG=1000000, DEPTH=6;
var ORDER=[3,2,4,1,5,0,6];
var KEY='yotsu-narabe-v1';
function $(id){return document.getElementById(id);}
var boardEl=$('board');
var reduced=false;
try{reduced=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;}catch(e){}

function fresh(){
  return {board:blank(),turn:1,starter:1,history:[],over:false,winner:0,winCells:[],mode:'pvp',level:'strong',scores:{r:0,y:0,d:0}};
}
function blank(){var a=[];for(var k=0;k<TOTAL;k++)a.push(0);return a;}
var S=fresh();
var busy=false, cpuTimer=null, landTimer=null;
function idx(r,c){return r*COLS+c;}

var WINDOWS=[];
(function(){
  for(var r=0;r<ROWS;r++)for(var c=0;c<COLS;c++){
    if(c+3<COLS)WINDOWS.push([idx(r,c),idx(r,c+1),idx(r,c+2),idx(r,c+3)]);
    if(r+3<ROWS)WINDOWS.push([idx(r,c),idx(r+1,c),idx(r+2,c),idx(r+3,c)]);
    if(r+3<ROWS&&c+3<COLS)WINDOWS.push([idx(r,c),idx(r+1,c+1),idx(r+2,c+2),idx(r+3,c+3)]);
    if(r+3<ROWS&&c-3>=0)WINDOWS.push([idx(r,c),idx(r+1,c-1),idx(r+2,c-2),idx(r+3,c-3)]);
  }
})();

function lowest(b,c){for(var r=ROWS-1;r>=0;r--)if(b[idx(r,c)]===0)return r;return -1;}
function validMoves(b){var m=[];for(var k=0;k<ORDER.length;k++)if(b[idx(0,ORDER[k])]===0)m.push(ORDER[k]);return m;}
function winLine(b,r,c,p){
  var dirs=[[0,1],[1,0],[1,1],[1,-1]];
  for(var d=0;d<4;d++){
    var dr=dirs[d][0],dc=dirs[d][1],cells=[idx(r,c)];
    for(var s=1;s>=-1;s-=2){
      var rr=r+dr*s,cc=c+dc*s;
      while(rr>=0&&rr<ROWS&&cc>=0&&cc<COLS&&b[idx(rr,cc)]===p){cells.push(idx(rr,cc));rr+=dr*s;cc+=dc*s;}
    }
    if(cells.length>=4)return cells;
  }
  return null;
}

/* ---- DOM ---- */
var cells=[], cols=[];
(function build(){
  for(var c=0;c<COLS;c++){
    var col=document.createElement('div');
    col.className='col';col.tabIndex=0;col.setAttribute('role','button');
    col.setAttribute('aria-label',(c+1)+'列目に入れる');
    for(var r=0;r<ROWS;r++){var cell=document.createElement('div');cell.className='cell';col.appendChild(cell);cells[idx(r,c)]=cell;}
    boardEl.appendChild(col);cols.push(col);
    (function(c,col){
      col.addEventListener('click',function(){tryDrop(c);});
      col.addEventListener('pointerenter',function(e){if(e.pointerType==='mouse')showGhost(c);});
      col.addEventListener('pointerleave',function(){clearGhost();});
      col.addEventListener('focus',function(){showGhost(c);});
      col.addEventListener('blur',function(){clearGhost();});
      col.addEventListener('keydown',function(e){
        if(e.key==='Enter'||e.key===' '){e.preventDefault();tryDrop(c);}
        else if(e.key==='ArrowLeft'){e.preventDefault();cols[(c+COLS-1)%COLS].focus();}
        else if(e.key==='ArrowRight'){e.preventDefault();cols[(c+1)%COLS].focus();}
      });
    })(c,col);
  }
})();
document.addEventListener('keydown',function(e){
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  var n=parseInt(e.key,10);
  if(n>=1&&n<=7){tryDrop(n-1);}
});

function humanCanPlay(){return !S.over&&!busy&&!(S.mode==='cpu'&&S.turn===2);}
function clearGhost(){var g=boardEl.querySelectorAll('.piece.ghost');for(var k=0;k<g.length;k++)g[k].parentNode.removeChild(g[k]);}
function showGhost(c){
  clearGhost();
  if(!humanCanPlay())return;
  var r=lowest(S.board,c);if(r<0)return;
  var el=document.createElement('div');el.className='piece ghost '+(S.turn===1?'red':'yellow');
  cells[idx(r,c)].appendChild(el);
}
function placePiece(r,c,p,animate){
  var cell=cells[idx(r,c)];
  var el=document.createElement('div');el.className='piece '+(p===1?'red':'yellow');
  cell.appendChild(el);
  if(!animate||reduced)return 0;
  var cellRect=cell.getBoundingClientRect(), boardRect=boardEl.getBoundingClientRect();
  var dist=(cellRect.top-boardRect.top)+cellRect.height;
  el.style.transition='none';
  el.style.transform='translateY('+(-dist)+'px)';
  el.getBoundingClientRect();
  var dur=Math.min(650,110+75*(r+1));
  el.style.transition='transform '+dur+'ms cubic-bezier(.4,0,.7,1.25)';
  el.style.transform='translateY(0)';
  setTimeout(function(){el.style.transition='';el.style.transform='';},dur+60);
  return dur;
}
function removePiece(r,c){var p=cells[idx(r,c)].querySelector('.piece:not(.ghost)');if(p)p.parentNode.removeChild(p);}

/* ---- game flow ---- */
function tryDrop(c){
  if(!humanCanPlay())return;
  if(lowest(S.board,c)<0)return;
  drop(c,true);
}
function drop(c,animate){
  var r=lowest(S.board,c);if(r<0)return;
  clearGhost();
  var p=S.turn;
  S.board[idx(r,c)]=p;S.history.push({r:r,c:c,p:p});
  var dur=placePiece(r,c,p,animate);
  var line=winLine(S.board,r,c,p);
  if(line){S.over=true;S.winner=p;S.winCells=line;S.scores[p===1?'r':'y']++;}
  else if(S.history.length===TOTAL){S.over=true;S.winner=0;S.scores.d++;}
  else S.turn=3-p;
  busy=true;
  render(true);
  save();
  clearTimeout(landTimer);
  landTimer=setTimeout(function(){
    busy=false;render(false);
    if(!S.over&&S.mode==='cpu'&&S.turn===2)scheduleCpu();
  },dur);
}
function scheduleCpu(){
  clearTimeout(cpuTimer);
  cpuTimer=setTimeout(function(){
    if(S.over||S.mode!=='cpu'||S.turn!==2||busy)return;
    drop(chooseMove(),true);
  },380);
}
function popMove(){
  var m=S.history.pop();if(!m)return;
  S.board[idx(m.r,m.c)]=0;
  if(S.over){
    if(S.winner===1)S.scores.r=Math.max(0,S.scores.r-1);
    else if(S.winner===2)S.scores.y=Math.max(0,S.scores.y-1);
    else S.scores.d=Math.max(0,S.scores.d-1);
    S.over=false;S.winner=0;S.winCells=[];
  }
  S.turn=m.p;
  removePiece(m.r,m.c);
}
function undo(){
  if(busy||!S.history.length)return;
  clearTimeout(cpuTimer);
  popMove();
  if(S.mode==='cpu'){while(S.history.length&&S.turn===2)popMove();}
  clearGhost();render(false);save();
  if(S.mode==='cpu'&&S.turn===2&&!S.over)scheduleCpu();
}
function newGame(first){
  clearTimeout(cpuTimer);clearTimeout(landTimer);busy=false;
  if(first){S.starter=first;}
  else if(S.history.length){S.starter=3-S.starter;}
  S.board=blank();S.history=[];S.over=false;S.winner=0;S.winCells=[];
  S.turn=S.starter;
  for(var k=0;k<cells.length;k++){
    cells[k].classList.remove('win');
    var ps=cells[k].querySelectorAll('.piece');
    for(var j=0;j<ps.length;j++)ps[j].parentNode.removeChild(ps[j]);
  }
  render(false);save();
  if(S.mode==='cpu'&&S.turn===2)scheduleCpu();
}
function setMode(m){
  if(S.mode===m)return;
  S.mode=m;S.scores={r:0,y:0,d:0};
  newGame(1);
}
function setLevel(l){S.level=l;render(false);save();}
function rebuild(){
  var b=blank();
  for(var k=0;k<cells.length;k++){
    cells[k].classList.remove('win');
    var ps=cells[k].querySelectorAll('.piece');
    for(var j=0;j<ps.length;j++)ps[j].parentNode.removeChild(ps[j]);
  }
  for(var i=0;i<S.history.length;i++){var m=S.history[i];b[idx(m.r,m.c)]=m.p;placePiece(m.r,m.c,m.p,false);}
  S.board=b;
}

/* ---- render ---- */
function setOn(id,on){var el=$(id);el.classList.toggle('is-on',on);el.setAttribute('aria-pressed',on?'true':'false');}
function render(pending){
  var cpu=S.mode==='cpu';
  setOn('modePvp',!cpu);setOn('modeCpu',cpu);
  $('levelSeg').hidden=!cpu;
  setOn('lvWeak',S.level==='weak');setOn('lvStrong',S.level!=='weak');
  $('nameRed').textContent=cpu?'あなた':'赤';
  $('nameYel').textContent=cpu?'CPU':'黄';
  var red=0,yel=0;
  for(var k=0;k<TOTAL;k++){if(S.board[k]===1)red++;else if(S.board[k]===2)yel++;}
  $('leftRed').textContent=21-red;$('leftYel').textContent=21-yel;
  $('pRed').classList.toggle('is-turn',!S.over&&S.turn===1);
  $('pYel').classList.toggle('is-turn',!S.over&&S.turn===2);

  var chip='red',t='';
  if(S.over&&!pending){
    if(S.winner===0){chip='none';t='引き分け！';}
    else{chip=S.winner===1?'red':'yellow';t=cpu?(S.winner===1?'あなたの勝ち！':'CPUの勝ち！'):(S.winner===1?'赤の勝ち！':'黄の勝ち！');}
  }else if(S.over&&pending){
    chip=S.winner===0?'none':(S.winner===1?'red':'yellow');t='…';
  }else{
    chip=S.turn===1?'red':'yellow';
    t=cpu?(S.turn===1?'あなたの番':'CPUが考え中…'):(S.turn===1?'赤の番':'黄の番');
  }
  $('msgChip').className='chip '+chip;
  $('msgText').textContent=t;
  $('msg').classList.toggle('is-result',S.over&&!pending);

  var showOver=S.over&&!pending;
  boardEl.classList.toggle('won',showOver&&S.winner!==0);
  boardEl.classList.toggle('locked',S.over||(cpu&&S.turn===2));
  for(var i=0;i<cells.length;i++)cells[i].classList.remove('win');
  if(showOver)for(var w=0;w<S.winCells.length;w++)cells[S.winCells[w]].classList.add('win');

  $('undoBtn').disabled=busy||!S.history.length||(cpu&&S.turn===2&&!S.over);
  $('newBtn').textContent=S.over?'もう一度あそぶ':'新しいゲーム';
  $('newBtn').classList.toggle('pulse',showOver);

  $('sRed').textContent=S.scores.r;$('sYel').textContent=S.scores.y;$('sDraw').textContent=S.scores.d;
}

/* ---- CPU ---- */
function wouldWin(b,c,p){var r=lowest(b,c);if(r<0)return false;b[idx(r,c)]=p;var w=!!winLine(b,r,c,p);b[idx(r,c)]=0;return w;}
function evaluate(b,me){
  var opp=3-me,s=0,r,k,w,m,o,v;
  for(r=0;r<ROWS;r++){v=b[idx(r,3)];if(v===me)s+=3;else if(v===opp)s-=3;}
  for(w=0;w<WINDOWS.length;w++){
    m=0;o=0;var win=WINDOWS[w];
    for(k=0;k<4;k++){v=b[win[k]];if(v===me)m++;else if(v===opp)o++;}
    if(m&&o)continue;
    if(m===3)s+=40;else if(m===2)s+=8;
    else if(o===3)s-=45;else if(o===2)s-=8;
  }
  return s;
}
function negamax(b,depth,alpha,beta,player){
  var moves=validMoves(b);
  if(!moves.length)return 0;
  var k,c,r,v;
  for(k=0;k<moves.length;k++){if(wouldWin(b,moves[k],player))return BIG+depth;}
  if(depth===0)return evaluate(b,player);
  var best=-Infinity;
  for(k=0;k<moves.length;k++){
    c=moves[k];r=lowest(b,c);
    b[idx(r,c)]=player;
    v=-negamax(b,depth-1,-beta,-alpha,3-player);
    b[idx(r,c)]=0;
    if(v>best)best=v;
    if(best>alpha)alpha=best;
    if(alpha>=beta)break;
  }
  return best;
}
function chooseMove(){
  var b=S.board.slice(),me=2,moves=validMoves(b),k,c;
  if(S.level==='weak'){
    for(k=0;k<moves.length;k++)if(wouldWin(b,moves[k],me))return moves[k];
    if(Math.random()<0.7){for(k=0;k<moves.length;k++)if(wouldWin(b,moves[k],1))return moves[k];}
    var W=[1,2,3,4,3,2,1],tot=0;
    for(k=0;k<moves.length;k++)tot+=W[moves[k]];
    var x=Math.random()*tot;
    for(k=0;k<moves.length;k++){x-=W[moves[k]];if(x<=0)return moves[k];}
    return moves[0];
  }
  var best=-Infinity,bestMoves=[];
  for(k=0;k<moves.length;k++){
    c=moves[k];var r=lowest(b,c);
    b[idx(r,c)]=me;
    var v=winLine(b,r,c,me)?BIG+DEPTH:-negamax(b,DEPTH-1,-Infinity,Infinity,1);
    b[idx(r,c)]=0;
    if(v>best){best=v;bestMoves=[c];}else if(v===best)bestMoves.push(c);
  }
  return bestMoves[Math.floor(Math.random()*bestMoves.length)];
}

/* ---- rules examples ---- */
(function buildExamples(){
  var EX=[
    {label:'ヨコそろえ',rows:['.....','.R...','RYYYY','YRRRY'],win:['2,1','2,2','2,3','2,4']},
    {label:'ナナメそろえ',rows:['Y....','RY...','RRYR.','YYRY.'],win:['0,0','1,1','2,2','3,3']},
    {label:'タテそろえ',rows:['..Y..','..Y..','R.YR.','RYYR.'],win:['0,2','1,2','2,2','3,2']}
  ];
  var wrap=$('examples');
  for(var e=0;e<EX.length;e++){
    var ex=EX[e],box=document.createElement('div');box.className='example';
    var mini=document.createElement('div');mini.className='mini';

        if(ex.win.indexOf(r+','+c)>=0)cell.classList.add('win');
        col.appendChild(cell);
      }
      mini.appendChild(col);
    }
    var lab=document.createElement('div');lab.className='label';lab.textContent=ex.label;
    box.appendChild(mini);box.appendChild(lab);wrap.appendChild(box);
  }
})();

$('modeCpu').addEventListener('click',function(){setMode('cpu');});
$('lvWeak').addEventListener('click',function(){setLevel('weak');});
$('lvStrong').addEventListener('click',function(){setLevel('strong');});
$('undoBtn').addEventListener('click',undo);

$('resetScore').addEventListener('click',function(){S.scores={r:0,y:0,d:0};render(false);save();});

/* ---- 新版の通知 (PWA) : 対局中でなければそのまま読み込み直す ---- */
window.addEventListener('app-update',function(){
  var midGame=S.history.length>0&&!S.over;
  if(!midGame){location.reload();return;}
  $('updToast').hidden=false;
});
$('updBtn').addEventListener('click',function(){location.reload();});

/* ---- persistence / boot ---- */
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function valid(d){return d&&d.board&&d.board.length===TOTAL&&d.history&&d.scores;}
function boot(data){
  var loaded=null;
  if(valid(data))loaded=data;
  else{try{var raw=localStorage.getItem(KEY);if(raw){var d=JSON.parse(raw);if(valid(d))loaded=d;}}catch(e){}}
  if(loaded){S=fresh();for(var k in loaded)if(Object.prototype.hasOwnProperty.call(loaded,k))S[k]=loaded[k];}
  rebuild();render(false);
  if(!S.over&&S.mode==='cpu'&&S.turn===2)scheduleCpu();
}
var hot=window.claude&&window.claude.hot;
if(hot&&hot.snapshot)hot.snapshot(function(){return S;});
if(hot&&hot.ready)hot.ready(boot);else boot(hot&&hot.data?hot.data:{});
})();
</script>
<script>
/* PWA: オフライン用のService Worker登録 + 前面に戻ったとき新版を確認 (https のときだけ動く) */
(function(){
  if(!('serviceWorker' in navigator))return;
  if(location.protocol!=='https:'&&location.hostname!=='localhost')return;
  var VKEY='yotsu-narabe-etag',reg=null,baseline=null,checking=false,last=0;
  navigator.serviceWorker.register('sw.js').then(function(r){reg=r;}).catch(function(){});
  function stamp(){
    return fetch('index.html',{method:'HEAD',cache:'no-store'}).then(function(res){
      if(!res.ok)return null;
      return res.headers.get('etag')||res.headers.get('last-modified')||null;
    }).catch(function(){return null;});
  }
  function remember(s){try{localStorage.setItem(VKEY,s);}catch(e){}}
  stamp().then(function(s){
    if(s){baseline=s;remember(s);}
    else{try{baseline=localStorage.getItem(VKEY);}catch(e){}}
  });
  function check(){
    var now=Date.now();
    if(checking||navigator.onLine===false||now-last<30000)return;
    checking=true;last=now;
    if(reg&&reg.update)reg.update().catch(function(){});
    stamp().then(function(s){
      checking=false;
      if(!s)return;
      if(!baseline){baseline=s;remember(s);return;}
      if(s!==baseline){baseline=s;remember(s);window.dispatchEvent(new Event('app-update'));}
    });
  }
  document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')check();});
  window.addEventListener('online',check);
  window.addEventListener('focus',check);
})();
</script>
